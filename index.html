<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamus Ruang Tenang</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fc;
            color: #333;
            max-width: 650px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        h2 { color: #2c3e50; }
        p.subtitle { color: #7f8c8d; margin-bottom: 30px; }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #3b82f6;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover { background-color: #2563eb; }
        .result-card {
            background: white;
            padding: 20px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: left;
            margin-bottom: 20px;
        }
        .result-card h3 {
            margin-top: 0;
            color: #1e293b;
            font-size: 16px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
        }
        .quote {
            font-style: italic;
            color: #475569;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .author {
            font-weight: bold;
            color: #334155;
            margin-bottom: 12px;
            font-size: 12px;
        }
        .affirmation {
            background: #eff6ff;
            padding: 10px 14px;
            border-left: 4px solid #3b82f6;
            border-radius: 4px;
            color: #1e40af;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .suggestion {
            font-size: 13px;
            color: #64748b;
            font-style: italic;
            border-top: 1px dashed #e2e8f0;
            padding-top: 8px;
            text-align: right;
        }
        .error { color: #ef4444; margin-top: 15px; }
    </style>
</head>
<body>

    <h2>Kamus Ruang Tenang</h2>
    <p class="subtitle">Ketikkan apa yang sedang Anda rasakan atau masalah yang dihadapi hari ini...</p>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Ketikkan masalahmu (misal: malas, overthinking, capek)...">
        <button onclick="searchAffirmation()">Cari</button>
    </div>

    <div id="resultContainer"></div>

    <script>
        const database = [
            {
                keywords: ["males", "malas", "kerja", "mojok", "berat", "enggan", "semangat"],
                category: "Kehilangan Motivasi & Malas Kerja",
                items: [
                    {
                        quote: "Rahasia untuk maju adalah dengan memulai. Rahasia untuk memulai adalah memecah tugas-tugas rumit menjadi bagian kecil.",
                        author: "— Mark Twain",
                        affirmation: "Aku tidak harus langsung sempurna menyelesaikan semuanya. Cukup mulai dari satu langkah kecil hari ini."
                    },
                    {
                        quote: "Jangan tunda sampai besok apa yang bisa dikerjakan hari ini, karena energi dan waktu terus berjalan.",
                        author: "— Pepatah Bijak",
                        affirmation: "Aku memilih untuk mulai bergerak sekarang, meskipun pelan, asal ada kemajuan."
                    }
                ]
            },
            {
                keywords: ["overthinking", "pikiran", "cemas", "takut", "gagal", "khawatir"],
                category: "Kecemasan & Pikiran Berlebih",
                items: [
                    {
                        quote: "Kita lebih sering menderita dalam khayalan daripada dalam kenyataan.",
                        author: "— Seneca",
                        affirmation: "Aku melepaskan skenario buruk yang belum tentu terjadi. Aku fokus pada apa yang ada di depan mataku saat ini."
                    },
                    {
                        quote: "Ketenangan datang dari dalam diri. Jangan mencarinya di luar.",
                        author: "— Buddha",
                        affirmation: "Pikiranku boleh ramai, tapi hatiku berhak memilih untuk tetap tenang dan bernapas perlahan."
                    }
                ]
            },
            {
                keywords: ["capek", "lelah", "burnout", "istirahat", "beban", "stres"],
                category: "Kelelahan Mental & Fisik",
                items: [
                    {
                        quote: "Istirahat bukanlah tanda kelemahan, melainkan jeda untuk mengumpulkan kekuatan baru.",
                        author: "— Refleksi Ruang Tenang",
                        affirmation: "Merasa lelah itu wajar. Hari ini, izinkan diriku beristirahat tanpa merasa bersalah."
                    }
                ]
            },
            {
                keywords: ["sendiri", "kesepian", "asing", "hampa"],
                category: "Kesepian & Keheningan",
                items: [
                    {
                        quote: "Kesendirian memberi ruang bagi jiwa untuk mendengar suara hatinya sendiri.",
                        author: "— Maharodja",
                        affirmation: "Aku nyaman berada dalam keheningan ini. Diriku sendiri adalah teman yang baik."
                    }
                ]
            }
        ];

        function searchAffirmation() {
            const input = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('resultContainer');
            container.innerHTML = '';

            if (!input) {
                container.innerHTML = '<p class="error">Silakan ketikkan sesuatu terlebih dahulu di kolom pencarian.</p>';
                return;
            }

            // Cari kategori yang cocok berdasarkan keywords
            let matchedCategories = database.filter(cat => 
                cat.keywords.some(keyword => input.includes(keyword))
            );

            if (matchedCategories.length === 0) {
                container.innerHTML = `<div class="result-card"><h3>Ruang Tenang</h3><p class="quote">"Setiap badai pasti berlalu, dan setiap kesulitan membawa jalan keluar."</p><div class="affirmation">Aku kuat menghadapi hari ini, apapun bentuk tantangannya.</div><div class="suggestion">Pilih yang menurut kamu paling pas.</div></div>`;
                return;
            }

            // Tampilkan hasil dari kategori yang cocok
            let htmlContent = '';
            matchedCategories.forEach(cat => {
                cat.items.forEach(item => {
                    htmlContent += `
                        <div class="result-card">
                            <h3>Kategori: ${cat.category}</h3>
                            <p class="quote">"${item.quote}"</p>
                            <p class="author">${item.author}</p>
                            <div class="affirmation">Afirmasi: ${item.affirmation}</div>
                            <div class="suggestion">Pilih yang menurut kamu paling pas.</div>
                        </div>
                    `;
                });
            });

            container.innerHTML = htmlContent;
        }

        // Jalankan pencarian saat menekan tombol Enter
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchAffirmation();
            }
        });
    </script>

</body>
</html>
