<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamus Ruang Tenang / Quiet Space Dictionary</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fc;
            color: #333;
            max-width: 650px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        h2 { color: #2c3e50; }
        p.subtitle { color: #7f8c8d; margin-bottom: 30px; }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px 15px;
            font-size: 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #3b82f6;
        }
        button {
            padding: 12px 20px;
            font-size: 16px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        button:hover { background-color: #2563eb; }
        .result-card {
            background: white;
            padding: 20px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: left;
            margin-bottom: 20px;
        }
        .result-card h3 {
            margin-top: 0;
            color: #1e293b;
            font-size: 16px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 8px;
        }
        .quote {
            font-style: italic;
            color: #475569;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .author {
            font-weight: bold;
            color: #334155;
            margin-bottom: 12px;
            font-size: 12px;
        }
        .affirmation {
            background: #eff6ff;
            padding: 10px 14px;
            border-left: 4px solid #3b82f6;
            border-radius: 4px;
            color: #1e40af;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 12px;
        }
        .suggestion {
            font-size: 13px;
            color: #64748b;
            font-style: italic;
            border-top: 1px dashed #e2e8f0;
            padding-top: 10px;
            text-align: right;
        }
        .not-found-card {
            background: #fef2f2;
            border: 1px solid #fecaca;
            padding: 20px 25px;
            border-radius: 12px;
            text-align: left;
            color: #991b1b;
        }
        .not-found-card h3 {
            margin-top: 0;
            font-size: 16px;
            border-bottom: 2px solid #fca5a5;
            padding-bottom: 8px;
            color: #7f1d1d;
        }
        .error { color: #ef4444; margin-top: 15px; }
        
        /* Panel Admin Panel Khusus Rekap */
        .admin-panel {
            margin-top: 40px;
            background: #1e293b;
            color: #f8fafc;
            padding: 15px 20px;
            border-radius: 10px;
            text-align: left;
            font-size: 13px;
        }
        .admin-panel h4 { margin: 0 0 10px 0; color: #38bdf8; }
        .admin-btn {
            background: #334155;
            color: white;
            border: 1px solid #475569;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-right: 5px;
        }
        .admin-btn:hover { background: #475569; }
        ul.missed-list { padding-left: 20px; margin: 8px 0; max-height: 120px; overflow-y: auto; }
    </style>
</head>
<body>

    <h2>Ruang Tenang: Pencari Afirmasi</h2>
    <p class="subtitle">Ketikkan apa yang sedang Anda rasakan... / Type how you are feeling today...</p>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="misal: males, capek, lazy, tired, overthinking...">
        <button onclick="searchAffirmation()">Cari / Search</button>
    </div>

    <div id="resultContainer"></div>

    <!-- PANEL ADMIN LOKAL UNTUK MELIHAT REKAP KATA YANG HILANG -->
    <div class="admin-panel">
        <h4>🛠️ Panel Evaluasi Kreator (Lokal)</h4>
        <p style="margin: 0 0 8px 0; color: #94a3b8;">Daftar kata tidak dikenal yang terekam di browser ini:</p>
        <ul id="missedList" class="missed-list">
            <li style="color: #64748b; font-style: italic;">Belum ada kata tercatat.</li>
        </ul>
        <div style="margin-top: 10px;">
            <button class="admin-btn" onclick="loadMissedKeywords()">Muat Ulang Daftar</button>
            <button class="admin-btn" style="background: #7f1d1d; border-color: #991b1b;" onclick="clearMissedKeywords()">Hapus Rekap</button>
        </div>
    </div>

    <script>
        const database = [
            // === DATABASE BAHASA INDONESIA ===
            {
                keywords: ["males", "malas", "kerja", "mojok", "berat", "enggan", "semangat", "stuck"],
                category: "Kehilangan Motivasi & Malas Kerja",
                suggestion: "Pilih yang menurut kamu paling pas.",
                items: [
                    {
                        quote: "Rahasia untuk maju adalah dengan memulai. Rahasia untuk memulai adalah memecah tugas-tugas rumit menjadi bagian kecil.",
                        author: "— Mark Twain",
                        affirmation: "Afirmasi: Aku tidak harus langsung sempurna menyelesaikan semuanya. Cukup mulai dari satu langkah kecil hari ini."
                    },
                    {
                        quote: "Jangan tunda sampai besok apa yang bisa dikerjakan hari ini, karena energi dan waktu terus berjalan.",
                        author: "— Benjamin Franklin",
                        affirmation: "Afirmasi: Tindakan kecil hari ini jauh lebih berharga daripada rencana besar yang hanya dipikirkan saja."
                    },
                    {
                        quote: "Semangat tidak datang begitu saja; semangat diciptakan dari tindakan kecil yang konsisten.",
                        author: "— Refleksi Ruang Tenang",
                        affirmation: "Afirmasi: Aku mengizinkan diriku bergerak perlahan, yang penting aku tidak berhenti melangkah."
                    }
                ]
            },
            {
                keywords: ["cemas", "takut", "gagal", "khawatir", "pikiran"],
                category: "Kecemasan & Pikiran Berlebih",
                suggestion: "Pilih yang menurut kamu paling pas.",
                items: [
                    {
                        quote: "Kita lebih sering menderita dalam khayalan daripada dalam kenyataan.",
                        author: "— Seneca",
                        affirmation: "Afirmasi: Aku melepaskan skenario buruk yang belum tentu terjadi. Aku fokus pada apa yang ada di depan mataku saat ini."
                    },
                    {
                        quote: "Ketenangan datang dari dalam diri. Jangan mencarinya di luar.",
                        author: "— Buddha",
                        affirmation: "Afirmasi: Pikiranku boleh ramai, tapi hatiku berhak memilih untuk tetap tenang dan bernapas perlahan."
                    }
                ]
            },
            {
                keywords: ["capek", "lelah", "burnout", "istirahat", "beban", "stres", "pening"],
                category: "Kelelahan Mental & Fisik",
                suggestion: "Pilih yang menurut kamu paling pas.",
                items: [
                    {
                        quote: "Istirahat bukanlah tanda kelemahan, melainkan jeda untuk mengumpulkan kekuatan baru.",
                        author: "— Refleksi Ruang Tenang",
                        affirmation: "Afirmasi: Merasa lelah itu wajar. Hari ini, izinkan diriku beristirahat tanpa merasa bersalah."
                    },
                    {
                        quote: "Bahkan mesin yang paling canggih pun butuh dimatikan sejenak agar tidak terbakar.",
                        author: "— Catatan Produksi",
                        affirmation: "Afirmasi: Menjaga kewarasan dan kesehatan diriku adalah prioritas utamaku hari ini."
                    }
                ]
            },
            
            // === ENGLISH DATABASE ===
            {
                keywords: ["lazy", "unmotivated", "procrastinate", "tired", "work", "sluggish", "stuck"],
                category: "Lack of Motivation & Laziness",
                suggestion: "Choose the one that resonates most with you.",
                items: [
                    {
                        quote: "The secret of getting ahead is getting started.",
                        author: "— Mark Twain",
                        affirmation: "Affirmation: I don't have to be perfect right away. Taking one small step today is enough."
                    },
                    {
                        quote: "Action isn't just the effect of motivation; it's also the cause of it.",
                        author: "— Mark Manson",
                        affirmation: "Affirmation: I will take just one tiny action right now, and let momentum build itself."
                    },
                    {
                        quote: "Small disciplines repeated with consistency every day lead to great achievements gained slowly over time.",
                        author: "— John C. Maxwell",
                        affirmation: "Affirmation: Progress is progress, no matter how small. I am moving forward at my own pace."
                    }
                ]
            },
            {
                keywords: ["overthinking", "anxious", "anxiety", "fear", "worry", "scared", "fail"],
                category: "Anxiety & Overthinking",
                suggestion: "Choose the one that resonates most with you.",
                items: [
                    {
                        quote: "We suffer more often in imagination than in reality.",
                        author: "— Seneca",
                        affirmation: "Affirmation: I release the worst-case scenarios that haven't happened. I focus on what is right in front of me today."
                    },
                    {
                        quote: "You don't have to see the whole staircase, just take the first step.",
                        author: "— Martin Luther King Jr.",
                        affirmation: "Affirmation: I quiet my racing mind by grounding myself in this exact present moment."
                    }
                ]
            },
            {
                keywords: ["exhausted", "burnout", "stress", "rest", "heavy", "drained"],
                category: "Mental & Physical Exhaustion",
                suggestion: "Choose the one that resonates most with you.",
                items: [
                    {
                        quote: "Rest is not a sign of weakness; it is a pause to gather new strength.",
                        author: "— Quiet Space Reflection",
                        affirmation: "Affirmation: It is okay to feel drained. Today, I give myself permission to rest without guilt."
                    },
                    {
                        quote: "Almost everything will work again if you unplug it for a few minutes... including you.",
                        author: "— Anne Lamott",
                        affirmation: "Affirmation: I choose to step back, breathe deeply, and let my mind recharge."
                    }
                ]
            }
        ];

        // --- FUNGSI LOCAL STORAGE UNTUK PENCATATAN ---
        function saveMissedKeyword(keyword) {
            let missed = JSON.parse(localStorage.getItem('missedKeywords')) || [];
            if (!missed.includes(keyword)) {
                missed.push(keyword);
                localStorage.setItem('missedKeywords', JSON.stringify(missed));
            }
            loadMissedKeywords();
        }

        function loadMissedKeywords() {
            let missed = JSON.parse(localStorage.getItem('missedKeywords')) || [];
            const listEl = document.getElementById('missedList');
            listEl.innerHTML = '';

            if (missed.length === 0) {
                listEl.innerHTML = '<li style="color: #64748b; font-style: italic;">Belum ada kata tercatat.</li>';
                return;
            }

            missed.forEach(word => {
                let li = document.createElement('li');
                li.textContent = word;
                listEl.appendChild(li);
            });
        }

        function clearMissedKeywords() {
            if (confirm("Hapus semua rekap kata yang tidak dikenal?")) {
                localStorage.removeItem('missedKeywords');
                loadMissedKeywords();
            }
        }

        // Jalankan saat halaman dimuat
        window.onload = function() {
            loadMissedKeywords();
        };
        // ----------------------------------------------

        function searchAffirmation() {
            const input = document.getElementById('searchInput').value.toLowerCase().trim();
            const container = document.getElementById('resultContainer');
            container.innerHTML = '';

            if (!input) {
                container.innerHTML = '<p class="error">Ketikkan sesuatu / Please type something first.</p>';
                return;
            }

            let matchedCategories = database.filter(cat => 
                cat.keywords.some(keyword => input.includes(keyword))
            );

            if (matchedCategories.length === 0) {
                // Simpan otomatis ke memori lokal browser
                saveMissedKeyword(input);

                container.innerHTML = `
                    <div class="not-found-card">
                        <h3>Kata Kunci Tidak Dikenali / Keyword Not Recognized</h3>
                        <p>Kata yang Anda cari: <strong>"${input}"</strong> belum ada di dalam database kamus.</p>
                        <p style="font-size: 13px; margin-top: 10px; color: #b91c1c;">💡 Kata ini telah otomatis tercatat di panel bawah web Anda untuk bahan evaluasi!</p>
                    </div>`;
                return;
            }

            let htmlContent = '';
            matchedCategories.forEach(cat => {
                cat.items.forEach(item => {
                    htmlContent += `
                        <div class="result-card">
                            <h3>Kategori: ${cat.category}</h3>
                            <p class="quote">"${item.quote}"</p>
                            <p class="author">${item.author}</p>
                            <div class="affirmation">${item.affirmation}</div>
                            <div class="suggestion">${cat.suggestion}</div>
                        </div>
                    `;
                });
            });

            container.innerHTML = htmlContent;
        }

        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                searchAffirmation();
            }
        });
    </script>

</body>
</html>
